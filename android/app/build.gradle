plugins {
    id 'com.android.application'
}

// 发布签名凭据只从「本机文件 / 环境变量 / -P 参数」读取，不写入版本库。
// 本机文件：android/signing.local.properties（已在 .gitignore 中排除）
def signingSecrets = new Properties()
def signingSecretsFile = rootProject.file('signing.local.properties')
if (signingSecretsFile.exists()) {
    signingSecretsFile.withInputStream { signingSecrets.load(it) }
}
def yikeSecret = { String key, String fallback ->
    def v = project.findProperty(key)
    if (v == null || v.toString().isEmpty()) v = System.getenv(key)
    if (v == null || v.toString().isEmpty()) v = signingSecrets.getProperty(key)
    return (v == null || v.toString().isEmpty()) ? fallback : v.toString()
}
def yikeStoreFile = yikeSecret('YIKE_STORE_FILE', 'yike.keystore')

android {
    namespace 'cn.ws9.liuyao'
    compileSdk 34

    defaultConfig {
        applicationId "cn.ws9.liuyao"
        // Android 6.0 (API 23) 起：原生 API、WebView 语法、CSS 与 TLS 均已做向下兼容
        minSdk 23
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            def ks = file(yikeStoreFile)
            if (ks.exists()) {
                storeFile ks
                storePassword yikeSecret('YIKE_STORE_PASSWORD', '')
                keyAlias yikeSecret('YIKE_KEY_ALIAS', '')
                keyPassword yikeSecret('YIKE_KEY_PASSWORD', '')
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix null
            minifyEnabled false
        }
        release {
            minifyEnabled false
            shrinkResources false
            if (file(yikeStoreFile).exists()) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/*']
        }
    }
}

dependencies {
    // 纯原生 WebView 壳，无第三方依赖：全部算法与界面在 assets/www 内
}
